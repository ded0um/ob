
media:
  input: images/sauvetages
  output: /images/sauvetages

content:
  - name: sauvetages
    label: Nos sauvetages
    type: collection
    path: _sauvetages
    filename: "{year}-{month}-{day}-{primary}.md"
    fields:
      - name: title
        label: Titre du sauvetage
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: image
        label: Photo du chat
        type: image
        required: true
      - name: body
        label: Histoire du sauvetage
        type: rich-text
        required: true
        